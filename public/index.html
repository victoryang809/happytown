<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#13223d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>HappyTown</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="player">
  <div class="shell">
    <header class="hud" id="hud" hidden>
      <div class="hud-l">
        <span class="chip" id="hudPhase"></span>
        <span class="hud-time" id="hudTime" title="Time left in this phase"></span>
      </div>
      <div class="hud-m" id="hudProg"></div>
      <div class="hud-r">
        <span class="stat hit" id="hudHit" hidden></span>
        <span class="stat" title="Your floors">🏢 <b id="hudFloors">0</b></span>
        <span class="stat" title="Your rank"><b id="hudRank">#1</b></span>
        <span class="stat bomb" id="hudBomb" hidden></span>
        <span class="stat shield" id="hudShield" hidden></span>
        <span class="hud-av" id="hudAv"></span>
      </div>
    </header>
    <div class="p-stage">
      <main id="main"></main>
      <aside class="p-mini" id="miniWrap">
        <div class="mini-cap"><span>🏘️ HappyTown live</span><span id="miniCap"></span></div>
        <div class="mini-town" id="miniTown"></div>
      </aside>
    </div>
  </div>

  <div class="rotate-ov" id="rotateOv">
    <div>
      <div class="rot-ic">📱</div>
      <h2>Turn your phone sideways</h2>
      <p>HappyTown is played in landscape mode.<br>If it doesn't turn, switch off rotation lock.</p>
    </div>
  </div>
  <div class="paused-ov" id="pausedOv" hidden><div><div class="big-emoji">⏸</div><h2>Paused by the host</h2><p>Hang on, the game will continue in a moment.</p></div></div>
  <div class="hit-stack" id="hitStack" aria-live="assertive"></div>
  <div class="conn" id="conn" hidden>Reconnecting…</div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/town.js"></script>
  <script src="/js/player.js"></script>
</body>
</html>
